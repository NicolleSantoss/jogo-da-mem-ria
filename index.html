<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nossa Fusão</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: linear-gradient(rgba(0, 20, 40, 0.7), rgba(0, 20, 40, 0.7)), 
                        url('fotos/stevenFundo.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* PLAYER ESTILO DYNAMIC ISLAND */
        .dynamic-island-player {
            position: fixed;
            top: 10px;
            width: 150px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .dynamic-island-player.active {
            width: 90%;
            max-width: 350px;
            height: 65px;
            border-radius: 30px;
        }

        .island-content {
            display: flex;
            align-items: center;
            width: 100%;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .dynamic-island-player.active .island-content {
            opacity: 1;
            pointer-events: auto;
        }

        .island-mini-icon {
            position: absolute;
            right: 15px;
            font-size: 14px;
            color: white;
        }
        .dynamic-island-player.active .island-mini-icon { opacity: 0; }

        .album-art {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #ff4d4d, #4d94ff);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .music-info {
            flex-grow: 1;
            color: white;
            margin-left: 12px;
            overflow: hidden;
        }

        .track-name { font-size: 13px; font-weight: 600; white-space: nowrap; }
        .artist-name { font-size: 11px; color: #a1a1a1; }

        #playPauseBtn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: white;
            padding: 0;
        }

        /* ESTILO DO JOGO */
        h1 { color: #a5f3fc; text-shadow: 0 0 15px rgba(165, 243, 252, 0.8); margin-top: 100px; z-index: 2; font-size: 1.6rem; }

        #tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 95%;
            max-width: 400px;
            margin: 15px auto;
            z-index: 2;
        }

        .carta {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(165, 243, 252, 0.2);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .carta img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: none; }
        .verso { font-size: 30px; color: #a5f3fc; }
        .virada { background: white; transform: rotateY(180deg); }
        .virada img { display: block; transform: rotateY(180deg); }
        .virada .verso { display: none; }

        /* ANIMAÇÃO DE FUSÃO */
        #animacao-fusao { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 150; }
        .gem { width: 60px; height: 60px; border-radius: 50%; position: absolute; filter: blur(5px); }
        .rubi { background: #ff4d4d; left: -100px; animation: aprox 2.5s forwards; }
        .safira { background: #4d94ff; left: 100px; animation: aprox 2.5s forwards; }
        @keyframes aprox { to { left: 0; opacity: 0.8; } }

        .brilho-fusao { width: 10px; height: 10px; background: white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; }
        .fusao-ativa .brilho-fusao { animation: explosao 2s 2s forwards; }
        @keyframes explosao { 0% { width: 0; height: 0; opacity: 1; } 50% { width: 1200px; height: 1200px; opacity: 1; filter: blur(50px); } 100% { width: 3000px; height: 3000px; opacity: 0; } }

        #mensagem-final {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 15, 26, 0.98); color: #a5f3fc; justify-content: center;
            align-items: center; flex-direction: column; text-align: center; z-index: 200; padding: 30px;
        }
        #mensagem-final.ativa { display: flex; }
    </style>
</head>
<body>

    <div class="dynamic-island-player" id="island">
        <span class="island-mini-icon">🎵</span>
        <div class="island-content">
            <div class="album-art"></div>
            <div class="music-info">
                <div class="track-name">Stronger Than You</div>
                <div class="artist-name">Garnet</div>
            </div>
            <button id="playPauseBtn">▶️</button>
        </div>
        <audio id="musica" loop src="fotos/musica.mp3"></audio>
    </div>

    <div id="animacao-fusao">
        <div class="gem rubi"></div>
        <div class="gem safira"></div>
        <div class="brilho-fusao"></div>
    </div>

    <h1>Jogo da Memória</h1>
    <div id="tabuleiro"></div>

    <div id="mensagem-final">
        <p style="font-size: 50px; margin-bottom: 20px;">💌</p>
        <p style="font-style: italic; font-size: 1.1rem; line-height: 1.6; max-width: 500px;">
            "Nossa fusão não é feita de mágica, é feita de paciência, de risadas e de escolha.<br>
            Eu escolho ser 'nós' todos os dias."
        </p>
        <br>
        <h2 style="color: white; font-size: 1.7rem;">Eu te AMO!<br>Quer namorar comigo?</h2>
    </div>

    <script>
        const island = document.getElementById('island');
        const musica = document.getElementById('musica');
        const btn = document.getElementById('playPauseBtn');

        island.onclick = () => { island.classList.toggle('active'); };

        btn.onclick = (e) => {
            e.stopPropagation();
            if(musica.paused) { musica.play(); btn.innerText = '⏸️'; island.classList.add('active'); }
            else { musica.pause(); btn.innerText = '▶️'; }
        };

        const imagens = [
            'fotos/foto1.jpeg', 'fotos/foto1.jpeg',
            'fotos/foto2.jpeg', 'fotos/foto2.jpeg',
            'fotos/foto3.jpeg', 'fotos/foto3.jpeg',
            'fotos/foto4.png', 'fotos/foto4.png',
            'fotos/foto5.jpeg', 'fotos/foto5.jpeg',
            'fotos/foto6.jpeg', 'fotos/foto6.jpeg'
        ];

        function embaralhar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const tabuleiro = document.getElementById('tabuleiro');
        embaralhar(imagens).forEach(src => {
            const carta = document.createElement('div');
            carta.className = 'carta';
            carta.innerHTML = `<img src="${src}"><div class="verso">?</div>`;
            tabuleiro.appendChild(carta);
        });

        const cartas = document.querySelectorAll('.carta');
        let primeira = null, segunda = null, bloqueado = false, pares = 0;

        cartas.forEach(carta => {
            carta.addEventListener('click', () => {
                if(bloqueado || carta === primeira || carta.classList.contains('virada')) return;
                carta.classList.add('virada');
                if(!primeira) { primeira = carta; return; }
                segunda = carta;
                bloqueado = true;
                if(primeira.querySelector('img').src === segunda.querySelector('img').src) {
                    pares++; primeira = null; segunda = null; bloqueado = false;
                    if(pares === 6) iniciarFusao();
                } else {
                    setTimeout(() => {
                        primeira.classList.remove('virada');
                        segunda.classList.remove('virada');
                        primeira = null; segunda = null; bloqueado = false;
                    }, 700);
                }
            });
        });

        function iniciarFusao() {
            setTimeout(() => {
                const anim = document.getElementById('animacao-fusao');
                anim.style.display = 'block';
                anim.classList.add('fusao-ativa');
                setTimeout(() => {
                    document.getElementById('mensagem-final').classList.add('ativa');
                    anim.style.display = 'none';
                }, 3500);
            }, 600);
        }
    </script>
</body>
</html>
